      const params = new URLSearchParams(window.location.search);
      const key = params.get('skill') || 'planche';
      const additionalSkill = window.additionalSkills?.find((item) => {
        const slug = item.name
          .toLocaleLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
        return slug === key;
      });
      const skill = skillData[key] || (additionalSkill && {
        name: additionalSkill.name,
        difficulty: additionalSkill.difficulty,
        badge: additionalSkill.badge,
        description: additionalSkill.description,
        progressions: [
          `Build the prerequisite strength for ${additionalSkill.name}.`,
          `Practice a scaled or assisted variation with strict form.`,
          `Gradually work toward the full ${additionalSkill.name}.`
        ],
        time: 'Progress varies with training history, consistency, recovery, and individual strengths.'
      });

      const content = document.getElementById('skill-detail-content');
      if (!skill) {
        content.innerHTML = `
          <div class="skill-detail-card">
            <p class="eyebrow">Skill detail</p>
            <h1>Skill not found</h1>
            <p>That skill is not in the ladder yet.</p>
            <a class="button" href="skills.html">Back to skill ladder</a>
          </div>
        `;
      } else {
      content.innerHTML = `
        <div class="skill-detail-card">
          <p class="eyebrow">Skill detail</p>
          <div class="detail-header">
            <h1>${skill.name}</h1>
            <span class="skill-level ${skill.badge}">${skill.difficulty}</span>
          </div>

          <div class="detail-layout">
            <div class="detail-copy">
              <h2>What it is</h2>
              <p>${skill.description}</p>

              <h2>Progressions</h2>
              <ul>
                ${skill.progressions.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>

            <aside class="detail-side">
              <div class="info-box">
                <span class="info-label">Time to achieve</span>
                <strong>${skill.time}</strong>
              </div>
              <div class="info-box">
                <span class="info-label">Difficulty</span>
